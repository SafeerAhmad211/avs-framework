name: Publish to PyPI

# Publishes on GitHub Release via PyPI Trusted Publishing (OpenID Connect).
# No API token is stored in this repository. Authentication is established by
# PyPI verifying a short-lived OIDC identity token issued by GitHub for this
# specific repository, workflow, and environment.
#
# One-time setup on PyPI (https://pypi.org/manage/account/publishing/):
#   Owner:              SafeerAhmad211
#   Repository name:    avs-framework
#   Workflow name:      publish.yml
#   Environment name:   pypi

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check distribution metadata
        run: |
          pip install twine
          twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/p/avs-framework
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
