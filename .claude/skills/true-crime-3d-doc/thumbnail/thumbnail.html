<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: Anton; src: url(fonts/Anton.ttf); }
@font-face { font-family: Oswald; src: url(fonts/Oswald.ttf); font-weight: 700; }
@font-face { font-family: SE; src: url(fonts/se.woff2); }
html, body { margin: 0; background: #000; }
#c { position: relative; width: 1280px; height: 720px; overflow: hidden; }
#img { position: absolute; left: -5px; top: 0; width: 1290px; height: 720px; background: url(src.jpg) center / cover;
  filter: contrast(1.14) saturate(1.18) brightness(1.06); }
/* lift the woman and the lit windows, darken the empty sky behind the text */
#glow { position: absolute; inset: 0; background:
  radial-gradient(160px 220px at 375px 560px, rgba(255,190,110,.22), transparent 70%),
  radial-gradient(150px 200px at 112px 530px, rgba(120,170,200,.16), transparent 70%),
  radial-gradient(520px 380px at 1080px 220px, rgba(255,200,120,.10), transparent 70%); mix-blend-mode: screen; }
#shade { position: absolute; inset: 0; background:
  radial-gradient(760px 500px at 260px 160px, rgba(0,0,0,.70), rgba(0,0,0,.35) 55%, transparent 75%),
  radial-gradient(130% 120% at 60% 55%, transparent 55%, rgba(0,0,0,.55) 100%); }
#t { position: absolute; left: 46px; top: 34px; display: grid; gap: 14px; }
.row { display: flex; align-items: center; gap: 18px; }
.big { font: 290px/0.82 Anton, sans-serif; color: #ff2a1f; letter-spacing: -4px;
  text-shadow: 0 6px 0 #5a0700, 0 10px 40px rgba(0,0,0,.9); -webkit-text-stroke: 2px #2a0300; }
.stack { display: grid; gap: 4px; }
.w { font: 104px/0.9 Anton, sans-serif; color: #fff; letter-spacing: 1px; text-shadow: 0 5px 0 #000, 0 8px 30px rgba(0,0,0,.95); }
.tag { justify-self: start; font: 700 64px/1 Oswald, sans-serif; color: #111; background: #ffd21f; padding: 8px 18px 10px;
  transform: rotate(-2deg); box-shadow: 0 8px 26px rgba(0,0,0,.7); letter-spacing: .5px; }
.stamp { font: 26px SE, monospace; color: #f2c46d; letter-spacing: 2px; text-shadow: 0 2px 8px #000; margin-top: 6px; }
svg { position: absolute; inset: 0; }

#photo { position: absolute; left: 912px; top: 338px; width: 258px; padding: 12px 12px 44px; background: #efe9dc;
  transform: rotate(4deg); box-shadow: 0 18px 40px rgba(0,0,0,.85), 0 2px 0 rgba(0,0,0,.4); }
#photo img { display: block; width: 234px; height: 262px; object-fit: cover; object-position: 50% 30%;
  filter: grayscale(1) contrast(1.25) brightness(.96) sepia(.18); }
#photo .cap { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font: 22px SE, monospace; color: #1b1b1b; letter-spacing: 1px; }
#photo .tape { position: absolute; top: -14px; left: 88px; width: 92px; height: 30px; background: rgba(200,40,30,.88); transform: rotate(-6deg); box-shadow: 0 2px 6px rgba(0,0,0,.4); }
</style></head><body><div id="c">
<div id="img"></div><div id="glow"></div><div id="shade"></div>
<svg width="1280" height="720" viewBox="0 0 1280 720">
  <!-- hand-drawn red ring around the watching windows -->
  <path d="M1012 92 C1090 40 1235 62 1262 150 C1285 228 1205 318 1090 322 C985 326 925 262 948 182 C962 136 1000 104 1060 92"
        fill="none" stroke="#ff2a1f" stroke-width="9" stroke-linecap="round" style="filter: drop-shadow(0 3px 6px rgba(0,0,0,.8))"/>
</svg>
<div id="photo"><div class="tape"></div><img src="kitty.jpg" alt=""><div class="cap">KITTY GENOVESE</div></div>
<div id="t">
  <div class="row"><div class="big">38</div><div class="stack"><div class="w">PEOPLE</div><div class="w">WATCHED.</div></div></div>
  <div class="tag">NOBODY CALLED?</div>
  <div class="stamp">KEW GARDENS, QUEENS · 1964</div>
</div>
</div></body></html>
