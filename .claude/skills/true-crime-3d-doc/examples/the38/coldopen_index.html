<!doctype html>

    <style>
      @font-face { font-family: "Playfair Display"; src: url("assets/fonts/playfair-display-latin-900-normal.woff2") format("woff2"); font-weight: 900; }
      @font-face { font-family: "Playfair Display"; src: url("assets/fonts/playfair-display-latin-400-italic.woff2") format("woff2"); font-weight: 400; font-style: italic; }
      @font-face { font-family: "Special Elite"; src: url("assets/fonts/special-elite-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; }
      #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .ov { position: absolute; color: #ece4d4; pointer-events: none; }
      #tag { left: 70px; top: 60px; font: 500 15px/1 "Inter", sans-serif; letter-spacing: 0.35em; color: rgba(236, 228, 212, 0.75); }
      #card { left: 90px; bottom: 110px; font-family: "Special Elite", monospace; }
      #card span { display: block; font-size: 38px; line-height: 1.5; letter-spacing: 0.05em; white-space: pre; text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9); }
      #card .time { color: #f0b462; font-size: 50px; }
      .lt { left: 90px; bottom: 100px; padding-left: 20px; border-left: 3px solid #c8322a; text-shadow: 0 2px 14px rgba(0, 0, 0, 0.95); }
      .lt .n { display: block; font: 500 34px/1.1 "Inter", sans-serif; letter-spacing: 0.12em; }
      .lt .d { display: block; margin-top: 10px; font: 400 26px/1 "Playfair Display", serif; font-style: italic; color: rgba(240, 180, 98, 0.95); }
      #quote { inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
      #qtime { font: 400 46px/1 "Special Elite", monospace; color: #f0b462; letter-spacing: 0.08em; }
      #qtext { margin-top: 40px; font: 400 64px/1.25 "Playfair Display", serif; font-style: italic; color: #f2ebdd; max-width: 1300px; }
      #qsrc { margin-top: 30px; font: 500 18px/1 "Inter", sans-serif; letter-spacing: 0.32em; color: rgba(236, 228, 212, 0.6); }
      #title { inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      #tmain { font: 900 230px/1 "Playfair Display", serif; letter-spacing: 0.04em; color: #f4ede0; text-shadow: 0 0 60px rgba(240, 160, 80, 0.45), 0 8px 40px rgba(0, 0, 0, 0.8); }
      #trule { width: 460px; height: 3px; margin-top: 26px; background: #c8322a; }
      #tsub { margin-top: 28px; font: 500 28px/1 "Inter", sans-serif; letter-spacing: 0.55em; color: rgba(244, 237, 224, 0.9); text-shadow: 0 2px 20px rgba(0, 0, 0, 0.9); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="86" data-width="1920" data-height="1080">
      <canvas id="gl" width="1920" height="1080"></canvas>
      <div id="tag" class="ov">DRAMATIZED RECONSTRUCTION</div>
      <div id="card" class="ov"><span id="c1"></span><span id="c2"></span><span id="c3" class="time"></span></div>
      <div id="lt1" class="ov lt"><span class="n">CATHERINE "KITTY" GENOVESE</span><span class="d">28 · bar manager, Hollis, Queens</span></div>
      <div id="lt2" class="ov lt"><span class="n">WINSTON MOSELEY</span><span class="d">29 · business-machine operator, South Ozone Park</span></div>
      <div id="quote" class="ov">
        <div id="qtime"></div>
        <div id="qtext">“Oh my God, he stabbed me! Help me!”</div>
        <div id="qsrc">AS HEARD BY NEIGHBORS ON AUSTIN STREET</div>
      </div>
      <div id="title" class="ov"><div id="tmain">THE 38</div><div id="trule"></div><div id="tsub">THE MURDER OF KITTY GENOVESE</div></div>

      <audio id="score" src="assets/sfx/score.wav" data-start="0" data-duration="86" data-volume="1"></audio>
      <audio id="v1" src="assets/vo/v1.wav" data-start="1.2" data-duration="6.53"></audio>
      <audio id="v2" src="assets/vo/v2.wav" data-start="10.6" data-duration="5.29"></audio>

    <script type="module" src="assets/js/film.js"></script>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 86 }, 0);
      tl.fromTo("#tag", { opacity: 0 }, { opacity: 1, duration: 1 }, 1.5);
      tl.to("#tag", { opacity: 0, duration: 1 }, 7.5);
      const lines = [["#c1", "KEW GARDENS, QUEENS"], ["#c2", "MARCH 13, 1964"], ["#c3", "3:15 A.M."]];
      lines.forEach(([id]) => tl.set(id, { textContent: "" }, 0));
      let ct = 2.0;
      lines.forEach(([id, txt]) => { for (let i = 1; i <= txt.length; i++) { tl.set(id, { textContent: txt.slice(0, i) }, ct); ct += 0.06; } ct += 0.4; });
      tl.fromTo("#card", { opacity: 1 }, { opacity: 0, duration: 1 }, 8.6);
      tl.fromTo("#lt1", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.8, ease: "power2.out" }, 19.0);
      tl.to("#lt1", { opacity: 0, duration: 0.6 }, 24.0);
      tl.fromTo("#lt2", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.8, ease: "power2.out" }, 40.2);
      tl.to("#lt2", { opacity: 0, duration: 0.6 }, 45.6);
      tl.set("#qtime", { textContent: "" }, 0);
      ["3", "3:", "3:1", "3:19", "3:19 ", "3:19 A", "3:19 A.", "3:19 A.M", "3:19 A.M."].forEach((s, i) => tl.set("#qtime", { textContent: s }, 60.0 + i * 0.07));
      tl.fromTo("#qtime", { opacity: 0 }, { opacity: 1, duration: 0.1 }, 59.95);
      tl.fromTo("#qtext", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 1.4, ease: "power2.out" }, 61.0);
      tl.fromTo("#qsrc", { opacity: 0 }, { opacity: 1, duration: 1 }, 62.0);
      tl.to(["#qtime", "#qtext", "#qsrc"], { opacity: 0, duration: 0.6 }, 63.5);
      tl.fromTo("#tmain", { opacity: 0, scale: 1.12, letterSpacing: "0.3em" }, { opacity: 1, scale: 1, letterSpacing: "0.04em", duration: 2.6, ease: "expo.out" }, 78.2);
      tl.fromTo("#trule", { scaleX: 0 }, { scaleX: 1, duration: 1, ease: "power3.inOut" }, 79.4);
      tl.fromTo("#tsub", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 1.2 }, 80.0);
      tl.to("#title", { opacity: 0, duration: 1.2 }, 84.6);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
